<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tic-tac.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head> 

<body>
    <div class="container">
        <div class="head">
            <div class="head__icons">
                <img class="icon-image" src="icons/Combined Shape Copy.svg" alt="">
                <img class="icon-image" src="icons/Oval Copy.svg" alt="">
            </div>
            <div class="button_turn">
                <button class="head__button_turn"><img class="button-img" src="icons/Combined Shape Copy 2.svg" alt="">
                    TURN</button>
            </div>
            <div class="button_reset">
                <button class="head__button_reset"><img class="button-img" src="icons/Redo Copy.svg" alt=""></button>
            </div>
        </div>
        <div class="main">
            <div class="main__tile">
            </div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Oval Copy.svg" alt=""></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Combined Shape Copy.svg" alt=""></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Combined Shape Copy.svg" alt=""></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Oval Copy.svg" alt=""></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Combined Shape Copy.svg" alt=""></div>
            <div class="main__tile"></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Oval Copy.svg" alt=""></div>
            <div class="main__tile"><img class="main__tile_icon" src="icons/Combined Shape Copy.svg" alt=""></div>
        </div>
        <div class="foot">
            <div class="foot_tile">
                <span class="button_title">X (P2)</span>
                <span class="count">14</span>
            </div>
            <div class=" foot_tile">
                <span class="button_title">TIES</span>
                <span class="count">32</span>
            </div>
            <div class="foot_tile">
                <span class="button_title">O (P1)</span>
                <span class="count">11</span>
            </div>
        </div>
    </div>
